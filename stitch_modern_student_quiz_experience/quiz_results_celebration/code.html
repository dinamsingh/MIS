<body class="bg-background min-h-screen font-body-md text-on-background relative overflow-hidden flex flex-col items-center justify-center md:hidden">
<!-- Confetti Background (Simulated via script below) -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<main class="w-full h-full flex flex-col px-margin-mobile py-lg z-10 max-w-[400px] mx-auto">
<!-- Header -->
<header class="text-center mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-sm">Quiz Completed!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Fantastic work! You've mastered this topic.</p>
</header>
<!-- Hero Visualization: Circular Progress -->
<div class="flex justify-center items-center mb-xl relative">
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- SVG Circle for Progress -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#e6eeff" stroke-width="8"></circle>
<circle class="transition-all duration-1000 ease-out" cx="50" cy="50" fill="none" r="45" stroke="url(#gradient)" stroke-dasharray="282.7" stroke-dashoffset="42.4" stroke-linecap="round" stroke-width="8"></circle>
<defs>
<lineargradient id="gradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#15157d"></stop>
<stop offset="100%" stop-color="#d4af37"></stop>
</lineargradient>
</defs>
</svg>
<!-- Center Text -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">85%</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mt-1">Score</span>
</div>
</div>
<!-- Shimmering overlays (subtle) -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 to-gold/5 rounded-full pointer-events-none blur-xl"></div>
</div>
<!-- Statistics Cards -->
<div class="grid grid-cols-2 gap-sm mb-xl">
<div class="bg-surface-container-lowest rounded-xl p-sm flex flex-col items-center justify-center ambient-shadow border border-surface-container">
<span class="material-symbols-outlined text-primary mb-2 text-[28px]">fact_check</span>
<span class="font-headline-md text-headline-md text-on-background">17/20</span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center mt-1">Correct Answers</span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-sm flex flex-col items-center justify-center ambient-shadow border border-surface-container">
<span class="material-symbols-outlined text-gold mb-2 text-[28px]">military_tech</span>
<span class="font-headline-md text-headline-md text-on-background">85/100</span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center mt-1">Total Marks</span>
</div>
</div>
<!-- Action Button -->

<button class="w-full bg-primary text-on-primary rounded-full py-4 font-label-sm text-label-sm flex items-center justify-center gap-2 ambient-shadow hover:bg-on-primary-fixed-variant transition-colors glow-effect focus:outline-none focus:ring-4 focus:ring-primary/20">
<span class="material-symbols-outlined text-[18px]">home</span>
                Return to Dashboard
            </button>
</div>
</main>
<script>
        // Simple Confetti Effect
        const colors = ['#15157d', '#d4af37', '#e1e0ff', '#4f54b4'];
        const container = document.getElementById('confetti-container');

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            // Random properties
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * 100;
            const top = Math.random() * -20;
            const size = Math.random() * 8 + 4;
            
            // Animation config
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 2;
            
            confetti.style.backgroundColor = color;
            confetti.style.left = left + '%';
            confetti.style.top = top + '%';
            confetti.style.width = size + 'px';
            confetti.style.height = size + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            
            container.appendChild(confetti);
            
            // Simple falling animation via JS
            confetti.animate([
                { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                { transform: `translate3d(${Math.random()*100 - 50}px, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                delay: delay * 1000,
                iterations: Infinity,
                easing: 'linear'
            });
        }
    </script>
