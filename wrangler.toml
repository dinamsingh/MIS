name = "mis"
compatibility_date = "2024-09-23"

# Serve the built static site (Vite output in ./dist) as a Worker.
# single-page-application handling makes every route fall back to index.html
# so React Router client-side routes (e.g. /dashboard) resolve correctly.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
